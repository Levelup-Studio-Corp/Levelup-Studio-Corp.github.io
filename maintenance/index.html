<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patch Notes - LevelUp Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
body{background:#05080c;color:white;min-height:100vh;padding:80px 20px 60px;display:flex;flex-direction:column;align-items:center;}
.gradient{position:fixed;width:100%;height:100%;background:radial-gradient(circle at 50% 10%,rgba(0,140,255,0.2),transparent 60%);z-index:-1;pointer-events:none;}

nav{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 40px;background:rgba(5,8,12,0.8);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.08);z-index:100;}
.nav-logo{font-weight:700;font-size:18px;letter-spacing:2px;opacity:.7;text-decoration:none;color:white;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-link{font-size:13px;font-weight:500;letter-spacing:1px;opacity:.6;text-decoration:none;color:white;text-transform:uppercase;transition:.2s;}
.nav-link:hover{opacity:1;color:#56c4ff;}
.lang-selector{position:relative;}
.lang-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:.2s;white-space:nowrap;}
.lang-btn:hover{background:rgba(255,255,255,0.1);}
.lang-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#0d1520;border:1px solid rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;min-width:110px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.lang-dropdown.open{display:block;}
.lang-option{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.15s;color:rgba(255,255,255,0.6);}
.lang-option:hover{background:rgba(255,255,255,0.06);color:white;}
.lang-option.active{color:#56c4ff;}

.main{width:100%;max-width:560px;margin-top:10px;}

.section-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:16px;}

/* 목록 */
.history-list{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.history-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;transition:.2s;user-select:none;}
.history-header:hover{background:rgba(255,255,255,0.04);}
.history-header-title{font-size:13px;font-weight:600;color:#c8dae8;letter-spacing:.5px;}
.history-toggle{font-size:11px;color:#4a6a84;transition:.2s;}
.history-toggle.open{transform:rotate(180deg);}
.history-items{display:none;border-top:1px solid rgba(255,255,255,0.06);}
.history-items.open{display:block;}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;cursor:pointer;transition:.2s;border-bottom:1px solid rgba(255,255,255,0.04);}
.history-item:last-child{border-bottom:none;}
.history-item:hover{background:rgba(255,255,255,0.04);}
.history-item.active{background:rgba(0,180,255,0.06);border-left:2px solid #56c4ff;}
.history-item-date{font-size:13px;color:#c8dae8;font-weight:600;}
.history-item-label{font-size:11px;color:#4a6a84;}

/* iframe 뷰어 */
.viewer{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;display:none;}
.viewer.active{display:block;}
.viewer-header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;}
.viewer-title{font-size:12px;font-weight:600;color:#56c4ff;letter-spacing:1px;text-transform:uppercase;}
.viewer iframe{width:100%;border:none;display:block;min-height:400px;}

footer{margin-top:40px;font-size:12px;color:#2a3a4a;}
canvas{position:fixed;top:0;left:0;z-index:-1;pointer-events:none;}

@media(max-width:768px){nav{padding:14px 20px;}}
</style>
</head>
<body>
<div class="gradient"></div>
<canvas id="bg"></canvas>

<nav>
  <a class="nav-logo" href="#" id="nav-logo-link">LEVELUP STUDIO</a>
  <div class="nav-right">
    <a class="nav-link" href="#" id="nav-back-link">◀ D.D.D.</a>
    <div class="lang-selector">
      <div class="lang-btn" onclick="toggleLangMenu()"><span id="lang-current">🇰🇷 KO</span> ▾</div>
      <div class="lang-dropdown" id="lang-dropdown">
        <div class="lang-option" data-lang="ko">🇰🇷 KO</div>
        <div class="lang-option" data-lang="en">🇺🇸 EN</div>
        <div class="lang-option" data-lang="id">🇮🇩 ID</div>
        <div class="lang-option" data-lang="ms">🇲🇾 MS</div>
        <div class="lang-option" data-lang="zh">🇨🇳 ZH</div>
        <div class="lang-option" data-lang="fr">🇫🇷 FR</div>
      </div>
    </div>
  </div>
</nav>

<div class="main">
  <!-- 점검 중 카드 자리 (나중에 여기 추가) -->
  <!-- <div id="maintenance-card"></div> -->

  <div class="section-title" id="section-title">수정 사항</div>

  <!-- 히스토리 목록 -->
  <div class="history-list">
    <div class="history-header" onclick="toggleList()">
      <div class="history-header-title" id="list-title">업데이트 내역</div>
      <div class="history-toggle" id="list-toggle">▼</div>
    </div>
    <div class="history-items" id="history-items">
      <!-- JS로 렌더링 -->
    </div>
  </div>

  <!-- iframe 뷰어 -->
  <div class="viewer active" id="viewer">
    <div class="viewer-header">
      <div class="viewer-title" id="viewer-title">2026.07.02</div>
    </div>
    <iframe id="viewer-frame" src="" scrolling="yes"></iframe>
  </div>
</div>

<footer>© 2026 LevelUp Studio Co., Ltd.</footer>

<script>
const LANGS = [
  {code:"ko",flag:"🇰🇷"},{code:"en",flag:"🇺🇸"},{code:"id",flag:"🇮🇩"},
  {code:"ms",flag:"🇲🇾"},{code:"zh",flag:"🇨🇳"},{code:"fr",flag:"🇫🇷"},
];

// 히스토리 목록 — 추가될 때마다 여기에 추가
const HISTORY = [
  { date:"2026-07-07", label:{ ko:"사용성 개선 / 밸런스 수정", en:"Usability / Balance Adjustments", id:"Peningkatan Kegunaan / Penyesuaian", ms:"Penambahbaikan / Pelarasan", zh:"易用性改进 / 平衡调整", fr:"Améliorations / Ajustements" } },
  { date:"2026-07-02", label:{ ko:"신규 컨텐츠 / 시스템 변경", en:"New Content / System Updates", id:"Konten Baru / Pembaruan Sistem", ms:"Kandungan Baharu / Kemas Kini Sistem", zh:"新内容 / 系统更新", fr:"Nouveau contenu / Mises à jour" } },
];

const UI = {
  ko:{ sectionTitle:"수정 사항", listTitle:"업데이트 내역", navBack:"◀ D.D.D." },
  en:{ sectionTitle:"Patch Notes", listTitle:"Update History", navBack:"◀ D.D.D." },
  id:{ sectionTitle:"Catatan Patch", listTitle:"Riwayat Pembaruan", navBack:"◀ D.D.D." },
  ms:{ sectionTitle:"Nota Patch", listTitle:"Sejarah Kemas Kini", navBack:"◀ D.D.D." },
  zh:{ sectionTitle:"补丁说明", listTitle:"更新历史", navBack:"◀ D.D.D." },
  fr:{ sectionTitle:"Notes de patch", listTitle:"Historique des mises à jour", navBack:"◀ D.D.D." },
};

let currentLang = "ko";
let selectedDate = HISTORY[0].date;

function getLang() {
  const p = new URLSearchParams(window.location.search).get("lang");
  if (p && UI[p]) { localStorage.setItem("lang", p); return p; }
  const saved = localStorage.getItem("lang");
  if (saved && UI[saved]) return saved;
  const os = navigator.language.split("-")[0];
  return UI[os] ? os : "en";
}

function setLang(code) {
  localStorage.setItem("lang", code);
  const url = new URL(window.location.href);
  url.searchParams.set("lang", code);
  window.location.href = url.toString();
}

function toggleLangMenu() {
  document.getElementById("lang-dropdown").classList.toggle("open");
}

document.addEventListener("click", e => {
  if (!e.target.closest(".lang-selector")) document.getElementById("lang-dropdown").classList.remove("open");
  const opt = e.target.closest(".lang-option");
  if (opt) setLang(opt.dataset.lang);
});

function updateLangUI(l) {
  const entry = LANGS.find(x => x.code === l);
  document.getElementById("lang-current").textContent = entry.flag + " " + l.toUpperCase();
  document.querySelectorAll(".lang-option").forEach(el => el.classList.toggle("active", el.dataset.lang === l));
}

function toggleList() {
  const items = document.getElementById("history-items");
  const toggle = document.getElementById("list-toggle");
  items.classList.toggle("open");
  toggle.classList.toggle("open");
}

function selectItem(date) {
  selectedDate = date;
  const lang = currentLang;
  const langParam = lang === "ko" ? "" : "?lang=" + lang;
  const url = `/maintenance/history/${date}.html${langParam}`;

  document.getElementById("viewer-frame").src = url;
  document.getElementById("viewer-title").textContent = date.replace(/-/g, ".");
  document.getElementById("viewer").classList.add("active");

  // 아이템 active 상태
  document.querySelectorAll(".history-item").forEach(el => {
    el.classList.toggle("active", el.dataset.date === date);
  });

  // iframe 높이 자동 조정
  const frame = document.getElementById("viewer-frame");
  frame.onload = () => {
    try {
      const h = frame.contentDocument.body.scrollHeight;
      frame.style.height = (h + 20) + "px";
    } catch(e) {
      frame.style.height = "600px";
    }
  };
}

function render() {
  currentLang = getLang();
  const l = currentLang;
  const ui = UI[l];
  const langParam = l === "ko" ? "" : "?lang=" + l;

  updateLangUI(l);
  document.getElementById("section-title").textContent = ui.sectionTitle;
  document.getElementById("list-title").textContent = ui.listTitle;
  document.getElementById("nav-logo-link").href = "https://levelupstudio.co.kr/" + langParam;
  document.getElementById("nav-back-link").href = "https://levelupstudio.co.kr/ddd/" + langParam;
  document.getElementById("nav-back-link").textContent = ui.navBack;

  const container = document.getElementById("history-items");
  container.innerHTML = HISTORY.map(h => `
    <div class="history-item ${h.date === selectedDate ? "active" : ""}" data-date="${h.date}" onclick="selectItem('${h.date}')">
      <div class="history-item-date">${h.date.replace(/-/g, ".")}</div>
      <div class="history-item-label">${h.label[l] || h.label.en}</div>
    </div>
  `).join("");

  // 최신 항목 기본 로드
  selectItem(selectedDate);
}

render();

</script>
<script src="/particle-bg.js"></script>
</body>
</html>
