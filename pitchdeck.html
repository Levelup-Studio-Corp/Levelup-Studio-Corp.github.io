<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D.D.D: See Ya in Respawn — Game Introduction</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/theme/black.min.css">
<style>
  :root{
    --bg: #05080c;
    --bg-2: #080c12;
    --accent-1: #0090ff;
    --accent-2: #00d2ff;
    --text-hi: #ffffff;
    --text-mid: #b7c8d8;
    --text-dim: #57697a;
    --line: rgba(0,150,255,0.14);
    --line-soft: rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;}
  html, body{background:var(--bg);}
  .reveal{font-family:'Poppins',sans-serif;color:var(--text-hi);}
  .reveal .slides{text-align:left;}
  .reveal .slides section{background:var(--bg); height:100%; padding:0;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Title slide ---------- */
  .title-slide{
    position:relative;
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:36px 56px;
  }

  /* faint background tactical grid */
  .bg-grid{
    position:absolute; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 62% 50%, black 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 80% 70% at 62% 50%, black 20%, transparent 75%);
    opacity:0;
    animation: fadeIn 1.4s ease forwards;
    animation-delay:.1s;
  }

  /* ---- top bar ---- */
  .hud-top{
    position:relative; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    opacity:0; animation: fadeUp .8s ease forwards; animation-delay:.15s;
  }
  .brand-mark{display:flex; align-items:center; gap:14px;}
  .brand-mark img{height:68px; width:auto; filter:drop-shadow(0 0 14px rgba(0,140,255,.5));}
  .brand-mark span{
    font-weight:700; font-size:20px; letter-spacing:3px;
    color:var(--text-hi); text-transform:uppercase;
    padding-top:4px;
  }
  .status-tag{
    display:flex; align-items:center; gap:8px;
    font-size:11px; letter-spacing:2px; color:var(--text-mid);
    padding:6px 12px; border:1px solid var(--line); border-radius:20px;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent-2);
    box-shadow:0 0 8px var(--accent-2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  /* ---- main content ---- */
  .hud-main{
    position:relative; z-index:3;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .title-block{
    flex:0 0 auto;
    max-width:760px;
    margin-left:calc(5% + 110px);
    transform:translateY(-50px);
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-size:15px; letter-spacing:4px; color:var(--accent-2);
    margin-bottom:30px;
    opacity:0; animation: fadeUp .8s ease forwards; animation-delay:.35s;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:linear-gradient(90deg,var(--accent-1),var(--accent-2));
  }
  .game-logo{
    font-size:158px;
    font-weight:800;
    line-height:.94;
    letter-spacing:-2px;
    margin:0;
    opacity:0;
    transform:translateY(36px);
    animation:logoReveal 1.1s cubic-bezier(.2,.65,.3,1) forwards;
    animation-delay:.45s;
  }
  .game-subtitle{
    font-size:34px;
    font-weight:600;
    color:var(--text-hi);
    margin-top:26px;
    letter-spacing:.3px;
    opacity:0;
    animation:fadeUp .9s ease forwards;
    animation-delay:.85s;
  }
  .game-subtitle .highlight{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:1.25em;
    letter-spacing:1px;
    padding:3px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--accent-2);
    background:rgba(0,144,255,.08);
    text-shadow:0 0 20px rgba(0,180,255,.6);
  }

  .meta-row{
    display:flex; gap:36px;
    margin-top:56px;
    opacity:0; animation:fadeUp .9s ease forwards; animation-delay:1.1s;
  }
  .meta-item{font-size:12px; letter-spacing:1.5px; color:var(--text-dim);}
  .meta-item b{display:block; font-size:16px; color:var(--text-mid); letter-spacing:.5px; margin-top:6px; font-weight:500;}

  /* ---- radar visual ---- */
  .radar-wrap{
    position:relative;
    flex:0 0 auto;
    height:440px;
    display:flex; align-items:center; justify-content:center;
    opacity:0; animation:fadeIn 1.3s ease forwards; animation-delay:.5s;
    transform:translateX(90px);
  }
  .radar{
    position:relative;
    width:400px; height:400px;
    border-radius:50%;
  }
  .radar-ring{
    position:absolute; inset:0; margin:auto;
    border-radius:50%;
    border:1px solid var(--line);
  }
  .r1{width:400px; height:400px;}
  .r2{width:283px; height:283px;}
  .r3{width:166px; height:166px;}
  .r4{width:58px; height:58px; border-color:rgba(0,180,255,.3);}
  .radar-cross{
    position:absolute; inset:0; margin:auto;
    width:400px; height:400px;
  }
  .radar-cross::before, .radar-cross::after{
    content:''; position:absolute; background:var(--line);
  }
  .radar-cross::before{ left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%);}
  .radar-cross::after{ top:50%; left:0; right:0; height:1px; transform:translateY(-50%);}
  .radar-sweep{
    position:absolute; inset:0; margin:auto;
    width:400px; height:400px;
    transform-origin:center;
    border-radius:50%;
    background:conic-gradient(from 0deg, rgba(0,210,255,.35), transparent 28%, transparent 100%);
    animation: sweep 4.5s linear infinite;
    -webkit-mask-image: radial-gradient(circle, black 60%, transparent 100%);
            mask-image: radial-gradient(circle, black 60%, transparent 100%);
  }
  .blip{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:var(--text-mid); opacity:.7;
  }
  .blip.respawn{
    inset:0; margin:auto;
    top:auto; left:auto;
    width:10px; height:10px;
    background:var(--accent-2);
    box-shadow:0 0 14px 3px rgba(0,210,255,.7);
    animation: pulse 1.6s ease-in-out infinite;
  }

  /* ---- bottom bar ---- */
  .hud-bottom{
    position:relative; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    opacity:0; animation:fadeUp .8s ease forwards; animation-delay:1.3s;
  }
  .hud-bottom .tag{
    font-size:11px; letter-spacing:2px; color:var(--text-dim);
  }
  .hud-bottom .tag b{color:var(--text-mid); font-weight:500;}
  .corner-mark{
    width:14px; height:14px;
    border-left:1.5px solid var(--accent-2);
    border-bottom:1.5px solid var(--accent-2);
    opacity:.7;
  }

  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @keyframes logoReveal{ from{opacity:0; transform:translateY(36px);} to{opacity:1; transform:translateY(0);} }
  @keyframes sweep{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(1.4);} }

  @media (max-width:900px){
    .title-slide{padding:24px 26px;}
    .hud-main{flex-direction:column; gap:24px; justify-content:center;}
    .radar-wrap{position:absolute; inset:0; height:100%; opacity:.18; z-index:0; transform:none;}
    .radar{width:340px; height:340px;}
    .r1{width:340px;height:340px;} .r2{width:240px;height:240px;} .r3{width:140px;height:140px;}
    .radar-cross{width:340px;height:340px;}
    .radar-sweep{width:340px;height:340px;}
    .title-block{max-width:100%; z-index:2;}
    .game-logo{font-size:56px;}
    .game-subtitle{font-size:17px;}
    .meta-row{gap:18px; flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides">

    <section>
      <div class="title-slide">
        <div class="bg-grid"></div>

        <div class="hud-top">
          <div class="brand-mark">
            <img src="https://levelupstudio.co.kr/logo.png" alt="LevelUp Studio logo">
            <span>Studio</span>
          </div>
          <div class="status-tag mono">
            <span class="status-dot"></span> LIVE · SOFT LAUNCH
          </div>
        </div>

        <div class="hud-main">
          <div class="title-block">
            <div class="eyebrow mono">TOP-DOWN P vs. P SHOOTER</div>
            <h1 class="game-logo">D.D.D.</h1>
            <p class="game-subtitle">See ya in <span class="highlight">RESPAWN</span></p>
            <div class="meta-row mono">
              <div class="meta-item">PLATFORM<b>Android · iOS</b></div>
              <div class="meta-item">STAGE<b>Soft Launch #2</b></div>
              <div class="meta-item">GRAND LAUNCH<b>2026.09</b></div>
            </div>
          </div>

          <div class="radar-wrap">
            <div class="radar">
              <div class="radar-ring r1"></div>
              <div class="radar-ring r2"></div>
              <div class="radar-ring r3"></div>
              <div class="radar-ring r4"></div>
              <div class="radar-cross"></div>
              <div class="radar-sweep"></div>
              <div class="blip" style="top:28%; left:62%;"></div>
              <div class="blip" style="top:68%; left:32%;"></div>
              <div class="blip" style="top:40%; left:22%;"></div>
              <div class="blip" style="top:74%; left:66%;"></div>
              <div class="blip respawn"></div>
            </div>
          </div>
        </div>

        <div class="hud-bottom mono">
          <div class="tag">GENRE <b>Casual Competitive P vs. P</b></div>
          <div class="corner-mark"></div>
        </div>
      </div>
    </section>

    <!-- 다음 슬라이드(outline 등)는 여기에 이어서 추가 -->

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    controls: true,
    progress: true,
    center: false,
    transition: 'fade',
    width: 1280,
    height: 720,
    margin: 0,
  });
</script>
</body>
</html>
